<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>充电桩运营平台 · 测试控制台</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f4f6fa; color:#2b3452; }
  header { background:linear-gradient(135deg,#1f3a6e,#2d5aa8); color:#fff; padding:16px 28px; display:flex; justify-content:space-between; align-items:center; }
  header h1 { font-size:18px; font-weight:600; }
  header .who { font-size:13px; opacity:.85; }
  header button { background:rgba(255,255,255,.15); border:1px solid rgba(255,255,255,.4); color:#fff; padding:5px 14px; border-radius:6px; cursor:pointer; font-size:13px; }
  .wrap { max-width:1080px; margin:24px auto; padding:0 16px; }
  .card { background:#fff; border-radius:10px; padding:20px 24px; margin-bottom:20px; box-shadow:0 1px 4px rgba(31,58,110,.08); }
  .card h2 { font-size:15px; color:#1f3a6e; margin-bottom:14px; border-left:4px solid #2d5aa8; padding-left:10px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:12px; }
  input,select { padding:8px 12px; border:1px solid #d4dbe8; border-radius:6px; font-size:14px; outline:none; }
  input:focus,select:focus { border-color:#2d5aa8; }
  .btn { background:#2d5aa8; color:#fff; border:none; padding:9px 20px; border-radius:6px; font-size:14px; cursor:pointer; }
  .btn:hover { background:#1f3a6e; }
  .btn.ghost { background:#eef2f9; color:#2d5aa8; }
  .btn.warn { background:#e6a23c; }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th,td { padding:9px 12px; text-align:left; border-bottom:1px solid #edf0f6; }
  th { background:#f0f3f9; color:#566388; font-weight:600; }
  .tag { display:inline-block; padding:2px 9px; border-radius:10px; font-size:12px; }
  .t-IDLE{background:#e6f7ec;color:#1a9e55;} .t-CHARGING{background:#e8f0fe;color:#2d5aa8;}
  .t-FAULT{background:#fdeaea;color:#d93026;} .t-OFFLINE{background:#eef0f3;color:#8a93a6;}
  .t-WARNING{background:#fff4e0;color:#c77f00;} .t-CRITICAL{background:#fdeaea;color:#d93026;}
  .t-OPEN{background:#fdeaea;color:#d93026;} .t-HANDLED{background:#e6f7ec;color:#1a9e55;}
  .stats { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:14px; }
  .stat { flex:1; min-width:150px; background:#f7f9fd; border:1px solid #e6ebf5; border-radius:8px; padding:12px 16px; }
  .stat .n { font-size:24px; font-weight:700; color:#1f3a6e; }
  .stat .l { font-size:12px; color:#8a93a6; margin-top:4px; }
  #chat { min-height:160px; max-height:340px; overflow-y:auto; background:#f7f9fd; border:1px solid #e6ebf5; border-radius:8px; padding:14px; margin-bottom:12px; font-size:14px; line-height:1.7; }
  #chat .me { color:#1f3a6e; font-weight:600; }
  #chat .ai { color:#2b3452; white-space:pre-wrap; }
  #chat .err { color:#d93026; }
  #report { background:#f7f9fd; border:1px solid #e6ebf5; border-radius:8px; padding:14px; font-size:14px; line-height:1.7; white-space:pre-wrap; display:none; }
  #loginCard { max-width:400px; margin:60px auto; }
  #loginCard input { width:100%; margin-bottom:12px; }
  .tips { font-size:12px; color:#8a93a6; margin-top:8px; line-height:1.6; }
  .msg { font-size:13px; color:#d93026; min-height:18px; margin-bottom:8px; }
  .hidden { display:none; }
</style>
</head>
<body>

<header>
  <h1>⚡ 充电桩运营平台 · 测试控制台</h1>
  <div class="who"><span id="whoami"></span> <button onclick="logout()">退出</button></div>
</header>

<!-- 登录 -->
<div class="card" id="loginCard">
  <h2>登录</h2>
  <div class="msg" id="loginMsg"></div>
  <input id="username" placeholder="用户名" value="admin">
  <input id="password" type="password" placeholder="密码" value="admin123">
  <button class="btn" style="width:100%" onclick="login()">登 录</button>
  <div class="tips">演示账号：admin/admin123（租户1）· operator2/operator123（租户2，验证隔离）</div>
</div>

<!-- 主界面 -->
<div class="wrap hidden" id="main">

  <div class="card">
    <h2>设备管理</h2>
    <div class="row">
      <select id="dvStatus">
        <option value="">全部状态</option>
        <option value="IDLE">空闲 IDLE</option>
        <option value="CHARGING">充电中 CHARGING</option>
        <option value="FAULT">故障 FAULT</option>
        <option value="OFFLINE">离线 OFFLINE</option>
      </select>
      <input id="dvStation" placeholder="站点名，如 星海站">
      <button class="btn" onclick="loadDevices()">查询设备</button>
      <span class="msg" id="dvMsg" style="margin:0"></span>
    </div>
    <table>
      <thead><tr><th>编码</th><th>名称</th><th>站点</th><th>状态</th><th>更新时间</th></tr></thead>
      <tbody id="dvBody"><tr><td colspan="5" style="color:#8a93a6">点击"查询设备"加载</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>告警监控</h2>
    <div class="row">
      <button class="btn" onclick="loadAlarms()">查询告警</button>
      <button class="btn ghost" onclick="loadStats()">刷新统计</button>
      <span class="msg" id="alMsg" style="margin:0"></span>
    </div>
    <div class="stats" id="statsBox">
      <div class="stat"><div class="n" id="stOpen">-</div><div class="l">未处理告警</div></div>
      <div class="stat"><div class="n" id="stCrit">-</div><div class="l">严重 CRITICAL</div></div>
      <div class="stat"><div class="n" id="stWarn">-</div><div class="l">警告 WARNING</div></div>
      <div class="stat" style="flex:2"><div class="n" id="stTop" style="font-size:14px;font-weight:600">-</div><div class="l">故障最多站点 Top3</div></div>
    </div>
    <table>
      <thead><tr><th>级别</th><th>站点</th><th>设备</th><th>内容</th><th>状态</th><th>时间</th></tr></thead>
      <tbody id="alBody"><tr><td colspan="6" style="color:#8a93a6">点击"查询告警"加载</td></tr></tbody>
    </table>
  </div>

  <div class="card">
    <h2>AI 助手（自然语言查数 / 告警日报）</h2>
    <div id="chat"></div>
    <div class="row">
      <input id="q" style="flex:1;min-width:260px" placeholder="例如：哪个站点故障最多？ / 现在有几台设备在充电？"
             onkeydown="if(event.key==='Enter')ask()">
      <button class="btn" onclick="ask()">发送</button>
      <button class="btn warn" onclick="dailyReport()">生成告警日报</button>
    </div>
    <div class="msg" id="aiMsg"></div>
    <div id="report"></div>
  </div>

</div>

<script>
let token = localStorage.getItem('cc_token') || '';
let username = localStorage.getItem('cc_user') || '';

async function api(method, path, body) {
  const headers = {'Content-Type':'application/json'};
  if (token) headers['Authorization'] = 'Bearer ' + token;
  const resp = await fetch(path, {method, headers, body: body ? JSON.stringify(body) : undefined});
  const data = await resp.json().catch(() => ({code:resp.status, msg:'响应解析失败'}));
  if (resp.status === 401) { logout(); throw new Error('登录已失效，请重新登录'); }
  if (data.code !== 200) throw new Error(data.msg || ('HTTP ' + resp.status));
  return data.data;
}

async function login() {
  const u = document.getElementById('username').value.trim();
  const p = document.getElementById('password').value;
  document.getElementById('loginMsg').textContent = '';
  try {
    const d = await fetch('/auth/login', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({username:u, password:p})
    }).then(r => r.json());
    if (d.code !== 200) throw new Error(d.msg);
    token = d.data.token; username = u;
    localStorage.setItem('cc_token', token);
    localStorage.setItem('cc_user', u);
    enter();
  } catch(e) { document.getElementById('loginMsg').textContent = '登录失败：' + e.message; }
}

function enter() {
  document.getElementById('loginCard').classList.add('hidden');
  document.getElementById('main').classList.remove('hidden');
  document.getElementById('whoami').textContent = '当前用户：' + username;
  loadDevices(); loadStats(); loadAlarms();
}

function logout() {
  token = ''; username = '';
  localStorage.removeItem('cc_token'); localStorage.removeItem('cc_user');
  document.getElementById('main').classList.add('hidden');
  document.getElementById('loginCard').classList.remove('hidden');
}

async function loadDevices() {
  const msg = document.getElementById('dvMsg'); msg.textContent = '';
  try {
    const status = document.getElementById('dvStatus').value;
    const station = document.getElementById('dvStation').value.trim();
    const d = await api('GET', `/devices?page=1&size=20&status=${status}&station=${encodeURIComponent(station)}`);
    const rows = (d.records || []).map(r =>
      `<tr><td>${r.code}</td><td>${r.name}</td><td>${r.station}</td>
       <td><span class="tag t-${r.status}">${r.status}</span></td><td>${r.updateTime||'-'}</td></tr>`).join('');
    document.getElementById('dvBody').innerHTML = rows || '<tr><td colspan="5" style="color:#8a93a6">无数据</td></tr>';
  } catch(e) { msg.textContent = e.message; }
}

async function loadAlarms() {
  const msg = document.getElementById('alMsg'); msg.textContent = '';
  try {
    const d = await api('GET', '/alarms?page=1&size=20');
    const rows = (d.records || []).map(r =>
      `<tr><td><span class="tag t-${r.level}">${r.level}</span></td><td>${r.station}</td><td>${r.deviceName}</td>
       <td>${r.content}</td><td><span class="tag t-${r.status}">${r.status}</span></td><td>${r.createTime||'-'}</td></tr>`).join('');
    document.getElementById('alBody').innerHTML = rows || '<tr><td colspan="6" style="color:#8a93a6">无数据</td></tr>';
  } catch(e) { msg.textContent = e.message; }
}

async function loadStats() {
  try {
    const d = await api('GET', '/alarms/stats');
    document.getElementById('stOpen').textContent = d.open ?? '-';
    document.getElementById('stCrit').textContent = (d.byLevel && d.byLevel.CRITICAL) ?? 0;
    document.getElementById('stWarn').textContent = (d.byLevel && d.byLevel.WARNING) ?? 0;
    const top = d.topStations || [];
    document.getElementById('stTop').textContent = top.length
      ? top.map((t,i) => `${i+1}. ${t.k}（${t.v} 起）`).join('　')
      : '暂无';
  } catch(e) { document.getElementById('stOpen').textContent = '加载失败'; }
}

async function ask() {
  const q = document.getElementById('q').value.trim();
  if (!q) return;
  const box = document.getElementById('chat');
  const msg = document.getElementById('aiMsg'); msg.textContent = '';
  box.insertAdjacentHTML('beforeend', `<div class="me">🙋 ${escapeHtml(q)}</div>`);
  document.getElementById('q').value = '';
  const loading = document.createElement('div');
  loading.className = 'ai'; loading.textContent = '⏳ 思考中…';
  box.appendChild(loading); box.scrollTop = box.scrollHeight;
  try {
    const d = await api('POST', '/ai/chat', {question: q});
    loading.textContent = '🤖 ' + d.answer;
  } catch(e) { loading.className = 'err'; loading.textContent = '❌ ' + e.message; }
  box.scrollTop = box.scrollHeight;
}

async function dailyReport() {
  const msg = document.getElementById('aiMsg'); msg.textContent = '⏳ 正在生成日报…';
  const rep = document.getElementById('report');
  try {
    const d = await api('GET', '/ai/daily-report');
    msg.textContent = '';
    rep.style.display = 'block';
    rep.textContent = d.report;
  } catch(e) { msg.textContent = '生成失败：' + e.message; }
}

function escapeHtml(s){ return s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

if (token) enter();
</script>
</body>
</html>
