  servlet:
    encoding:
      charset: UTF-8
      force: true

spring:
  application:
    name: charge-alarm
  http:
    encoding:
      charset: UTF-8
      force: true
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/charge_cloud?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: charge
    password: charge123
    driver-class-name: com.mysql.cj.jdbc.Driver
